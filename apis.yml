name: Sesame HR
kind: company
description: Sesame HR is an all-in-one HR and time-tracking platform used by small
  and mid-sized companies across Spain, Latin America, and beyond to manage
  employees, time clock (check-in / check-out), work hours, shifts and scheduling,
  vacations, absences and leave, contracts, payroll data, and recruitment. The
  Sesame Public API (v3) exposes that same functionality over a documented REST
  interface authenticated with a Bearer API token, letting teams sync HRIS data
  with payroll and ERP systems, build custom dashboards, and automate onboarding,
  shift assignment, and absence-approval workflows.
