description: >-
  FinOps view of Sesame HR spend. Sesame HR is a per-employee, per-month SaaS
  subscription billed annually; cost scales primarily with headcount (active
  employee seats) and the set of modules enabled. The Public API does not carry
  its own usage-based invoice - API access is included with the subscription and
  bounded by a shared 1,000 requests/minute rate limit rather than metered per
  call. The main cost levers are therefore seat count, plan tier, and module
  selection, not API traffic.
notes: >-
  Per-seat rates vary by region and negotiated terms; verify on the Sesame HR
  pricing page. Because billing is seat-based, deprovisioning inactive employees
  and right-sizing module add-ons are the primary optimization levers.
