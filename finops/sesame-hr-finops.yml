meters:
- name: employee_seats
  description: Active employee seats subscribed, billed per user per month.
  unit: seats
  aggregation: sum
  dimensions:
  - company
  - plan
- name: modules
  description: Optional modules enabled (scheduling, recruitment, payroll integrations) that affect per-seat price.
  unit: modules
  aggregation: sum
  dimensions:
  - company
- name: api_requests
  description: Public API requests. Included in the subscription (no per-call charge); capped at 1,000/min per company.
  unit: requests
  aggregation: sum
  dimensions:
  - company
principles:
- name: Visibility
  description: Track active employee seats and enabled modules per company; API traffic is unbilled but monitor it against the 1,000/min shared limit.
- name: Allocation
  description: Map seats to departments/offices so subscription cost aligns to internal cost centers.
- name: Optimization
  description: Deprovision inactive employees promptly, prefer annual billing for the lower per-seat rate, and enable only the modules in use.
- name: Accountability
  description: Assign an owner for the Sesame HR subscription and review seat counts and module add-ons each renewal cycle.
